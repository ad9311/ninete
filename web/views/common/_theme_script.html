{{ define "theme_script" }}
  <script nonce="{{ .cspNonce }}">
    (function () {
      try {
        var pref = localStorage.getItem("theme") || "auto";
        var dark =
          pref === "dark" ||
          (pref === "auto" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.className = dark
          ? "theme-dark"
          : "theme-light";
      } catch (e) {}
    })();
  </script>
{{ end }}
