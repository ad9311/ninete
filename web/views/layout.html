{{ define "layout" }}
  <!doctype html>
  <html lang="en" class="theme-light">
    <head>
      <meta charset="UTF-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="csp-nonce" content="{{ .cspNonce }}" />
      <meta name="version" content="{{ .version }}" />
      <!-- The SPA's fetch wrapper reads the CSRF token here: nosurf keeps it in
        an HttpOnly cookie, so JS has no other way to see it. -->
      <meta name="csrf-token" content="{{ .csrfToken }}" />
      <script nonce="{{ .cspNonce }}">
        (function () {
          try {
            var pref = localStorage.getItem("theme") || "auto";
            var dark =
              pref === "dark" ||
              (pref === "auto" &&
                window.matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.className = dark
              ? "theme-dark"
              : "theme-light";
          } catch (e) {}
        })();
      </script>
      <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico" />
      <link
        rel="stylesheet"
        href="/static/css/layout.css"
        data-turbo-track="reload"
      />
      <script
        src="/static/js/build/index.js"
        data-turbo-track="reload"
        type="module"
      ></script>
      <title>NINETE</title>
    </head>
    <body>
      <div class="page-shell">
        {{ template "header" . }}
        <main class="page-main">
          {{ block "main" . }}
          {{ end }}
        </main>
        {{ template "footer" . }}
      </div>
    </body>
  </html>
{{ end }}
