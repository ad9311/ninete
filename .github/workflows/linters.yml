name: linters

on:
  push:
    branches: [main, master, spa-base]
  pull_request:
    branches: [main, master, spa-base]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pinned rather than taken from the runner image, for the same reason
      # golangci is pinned above: a new release adds new checks, and an image
      # bump must not fail a PR that changed nothing. Installed unconditionally
      # so a broken download fails loudly here instead of turning the job into a
      # silent no-op — the deploy scripts have no other coverage.
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install "/tmp/shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run ShellCheck
        run: make lint-sh

  # The formatters had no CI job until Phase 0.6, which is how an unformatted
  # file reached spa-base: `make lint-fix` formats, but nothing checked that
  # someone had run it.
  prettier:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:static:check

  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint:js

  # Two tools, not one: tsc does not parse .svelte at all, so a tsc-only job
  # would report success with every component unchecked. Both steps run; the
  # second is guarded with !cancelled() rather than always() so a superseded run
  # still stops at the concurrency cancel above.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check TypeScript (tsc)
        run: bun run typecheck:ts

      - name: Type-check Svelte components (svelte-check)
        if: ${{ !cancelled() }}
        run: bun run typecheck:svelte

  stylelint:
    name: stylelint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Stylelint
        run: bun run lint:css
