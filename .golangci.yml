version: "2"

run:
  timeout: 2m
  tests: true
  go: "1.27.0"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true

linters:
  enable:
    # Default
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

    # Added
    - revive
    - misspell
    - importas
    - gocyclo
    - err113
    - errname
    - nlreturn
    - gocritic
    - gochecknoglobals
    - gosec
    - lll
    - forbidigo

  settings:
    forbidigo:
      # Query keys are declared once, as `query:"…"` tags that decodeQuery fills
      # (internal/handlers/query.go), because TestAPIContract reads the keys
      # from those tags into contract/api.json. A key read any other way never
      # reaches the contract, so a rename would go unnoticed by the MCP server.
      # Scoped to internal/handlers by the exclusions below.
      forbid:
        - pattern: '\.(URL\.Query|URL\.RawQuery|FormValue|ParseForm|Form)$'
          msg: "declare query keys as `query` tags and read them with decodeQuery (internal/handlers/query.go)"
    lll:
      line-length: 120
      tab-width: 2
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - linters: [gosec]
        path: 'internal/repo/token.go'
        text: 'G101'
      # Every query in internal/repo concatenates a sub-query built by
      # QueryOptions, which interpolates only whitelisted column names,
      # operators, connectors and sort orders and emits LIMIT/OFFSET as
      # integers; values are always bound as "?" placeholders. See
      # internal/repo/query_options.go. gosec cannot see the whitelist and
      # flags every call site, so the rule is excluded for the package rather
      # than annotated 13 times. The exclusion is scoped to internal/repo: a
      # query assembled anywhere else is still reported.
      - linters: [gosec]
        path: 'internal/repo/'
        text: 'G20[12]'
      - linters: [forbidigo]
        path-except: '^internal/handlers/'
      - linters: [forbidigo]
        path: '^internal/handlers/(query\.go$|.*_test\.go$)'
