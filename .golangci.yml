version: "2"

run:
  timeout: 2m
  tests: true
  go: "1.27.0"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true

linters:
  enable:
    # Default
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign

    # Added
    - revive
    - misspell
    - importas
    - gocyclo
    - err113
    - errname
    - nlreturn
    - gocritic
    - gochecknoglobals
    - gosec
    - lll
    - forbidigo

  settings:
    forbidigo:
      # Query strings are declared once on each side, as `query:"…"` tags:
      # decodeQuery reads them in the app (internal/handlers/query.go) and
      # api.EncodeQuery writes them in the MCP server (mcp/internal/api/query.go).
      # contract/api.json and contracttest compare the two sets of tags, so a
      # key read or written any other way escapes the contract. Scoped to
      # internal/handlers and mcp/internal/tools by the exclusions below.
      forbid:
        - pattern: '\.(URL\.Query|URL\.RawQuery|FormValue|ParseForm|Form)$'
          msg: "declare query keys as `query` tags and read them with decodeQuery (internal/handlers/query.go)"
        - pattern: '^url\.Values$'
          msg: "declare the query as a struct in mcp/internal/api/query.go and pass it to API.Get"
    lll:
      line-length: 120
      tab-width: 2
    revive:
      rules:
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - linters: [gosec]
        path: 'internal/repo/token.go'
        text: 'G101'
      # Every query in internal/repo concatenates a sub-query built by
      # QueryOptions, which interpolates only whitelisted column names,
      # operators, connectors and sort orders and emits LIMIT/OFFSET as
      # integers; values are always bound as "?" placeholders. See
      # internal/repo/query_options.go. gosec cannot see the whitelist and
      # flags every call site, so the rule is excluded for the package rather
      # than annotated 13 times. The exclusion is scoped to internal/repo: a
      # query assembled anywhere else is still reported.
      - linters: [gosec]
        path: 'internal/repo/'
        text: 'G20[12]'
      - linters: [forbidigo]
        path-except: '(^|/)internal/(handlers|tools)/'
      - linters: [forbidigo]
        path: '(^internal/handlers/query\.go$|_test\.go$)'
